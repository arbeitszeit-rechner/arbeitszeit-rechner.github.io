{{- $current := .RelPermalink -}}
<header class="site-header">
  <div class="container container--wide nav">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="hauptmenue">
      <span class="sr-only">Menü</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>
    <nav id="hauptmenue" class="nav-menu" aria-label="Hauptnavigation">
      <ul>
        {{- range site.Menus.main }}
        {{- $exact := eq .URL $current }}
        {{- $section := and (ne .URL "/") (hasPrefix $current .URL) (not $exact) }}
        <li><a href="{{ .URL }}"{{ if $exact }} aria-current="page"{{ end }}{{ if $section }} class="is-section"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
